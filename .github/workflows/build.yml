name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev libxkbcommon-dev libvulkan-dev \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libboost-dev libfftw3-dev \
            python3-dev libudev-dev dpkg-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_PACKAGE_CONTACT="pat.felix92@gmail.com" \
            -DCPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Build .deb package
        run: |
          cd build
          cpack -G DEB

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSView-linux-deb
          path: build/*.deb

      - name: Install into AppDir
        run: |
          rm -rf AppDir
          DESTDIR="${GITHUB_WORKSPACE}/AppDir" cmake --install build

      - name: Download linuxdeployqt
        run: |
          wget -q -O linuxdeployqt \
            "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod +x linuxdeployqt

      - name: Build AppImage
        run: |
          export QMAKE="$(which qmake6)"
          ./linuxdeployqt --appimage-extract-and-run \
            "${GITHUB_WORKSPACE}/AppDir/usr/share/applications/dsview.desktop" \
            -qmake="${QMAKE}" \
            -appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSView-linux-appimage
          path: '*.AppImage'

  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-winextras
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkg-config

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Install
        run: cmake --install build

      - name: Package as zip
        run: |
          cd build/install
          7z a -r "${GITHUB_WORKSPACE}/DSView-windows-x86_64.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSView-windows
          path: DSView-windows-x86_64.zip
