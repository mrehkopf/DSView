name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev libxkbcommon-dev libvulkan-dev \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libboost-dev libfftw3-dev \
            python3-dev libudev-dev dpkg-dev rsync

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_PACKAGE_CONTACT="pat.felix92@gmail.com" \
            -DCPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Build .deb package
        run: |
          cd build
          cpack -G DEB

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSView-linux-deb
          path: build/*.deb

      - name: Install into AppDir
        run: |
          rm -rf AppDir
          DESTDIR="${GITHUB_WORKSPACE}/AppDir" cmake --install build

      - name: Download linuxdeployqt
        run: |
          wget -q -O linuxdeployqt \
            "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod +x linuxdeployqt

      - name: Build AppImage
        run: |
          export QMAKE="$(which qmake6)"
          # Deploy Qt/shared-lib dependencies into AppDir, but don't build the
          # final .AppImage yet - we still need to bundle the Python stdlib
          # (DSView embeds Python for its protocol decoders, and linuxdeployqt
          # only picks up libpython*.so via ldd, not the stdlib data files it
          # loads at runtime, e.g. the `encodings` module).
          ./linuxdeployqt --appimage-extract-and-run \
            "${GITHUB_WORKSPACE}/AppDir/usr/share/applications/dsview.desktop" \
            -qmake="${QMAKE}"

          # linuxdeployqt doesn't reliably pick up libpython*.so (it isn't a
          # direct Qt dependency), so make sure it's actually in AppDir/usr/lib
          # by copying whatever the just-installed binary is linked against.
          ldd "${GITHUB_WORKSPACE}/AppDir/usr/bin/DSView" \
            | awk '/libpython/ {print $3}' \
            | xargs -r -I{} cp -Lv {} "${GITHUB_WORKSPACE}/AppDir/usr/lib/"

          PYVER="$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          PYLIBDIR="/usr/lib/python${PYVER}"
          DEST="${GITHUB_WORKSPACE}/AppDir/usr/lib/python${PYVER}"
          mkdir -p "${DEST}"
          rsync -a \
            --exclude 'test' --exclude 'idlelib' --exclude 'tkinter' --exclude '__pycache__' \
            "${PYLIBDIR}/" "${DEST}/"

          # linuxdeployqt's AppRun only sets up the Qt/library environment.
          # Wrap it with our own AppRun that also points the bundled Python
          # interpreter at the bundled stdlib, instead of falling back to
          # whatever python3 (and version) happens to be on the host.
          mv "${GITHUB_WORKSPACE}/AppDir/AppRun" "${GITHUB_WORKSPACE}/AppDir/AppRun.qt"
          cat > "${GITHUB_WORKSPACE}/AppDir/AppRun" <<EOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export PYTHONHOME="\$HERE/usr"
          export PYTHONPATH="\$HERE/usr/lib/python${PYVER}:\$HERE/usr/lib/python${PYVER}/lib-dynload"
          exec "\$HERE/AppRun.qt" "\$@"
          EOF
          chmod +x "${GITHUB_WORKSPACE}/AppDir/AppRun"

          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run \
            "${GITHUB_WORKSPACE}/AppDir" DSView-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSView-linux-appimage
          path: '*.AppImage'

  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-winextras
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkg-config

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dsview-dist

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Install
        run: cmake --install build

      - name: Package as zip
        run: |
          cd dsview-dist
          zip -r "${GITHUB_WORKSPACE}/DSView-windows-x86_64.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: DSView-windows
          path: DSView-windows-x86_64.zip
